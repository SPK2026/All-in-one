        // Global State
        let currentCategory = 'all';
        let searchQuery = '';
        let favorites = JSON.parse(localStorage.getItem('fl_favs') || '[]');

        // Initialize Theme from localStorage or system preference
        if (localStorage.getItem('theme') === 'light' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: light)').matches)) {
            document.documentElement.classList.remove('dark');
            updateThemeIcon(false);
        } else {
            document.documentElement.classList.add('dark');
            updateThemeIcon(true);
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeIcon(isDark);
        }

        function updateThemeIcon(isDark) {
            const icon = document.getElementById('themeIcon');
            icon.className = isDark ? 'fa-solid fa-sun text-amber-400 text-lg' : 'fa-solid fa-moon text-slate-700 text-lg';
        }

        // Favorites Handling
        function toggleFavorite(id, e) {
            e.stopPropagation();
            if (favorites.includes(id)) {
                favorites = favorites.filter(fav => fav !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('fl_favs', JSON.stringify(favorites));
            updateStats();
            renderCards();
        }

        // Stats Counter Calculation
        function updateStats() {
            document.getElementById('statTotal').innerText = resources.length;
            document.getElementById('statTrackers').innerText = resources.filter(r => r.category === 'trackers').length;
            document.getElementById('statValidations').innerText = resources.filter(r => r.category === 'validations').length;
            document.getElementById('statForms').innerText = resources.filter(r => r.category === 'forms').length;
            document.getElementById('favCount').innerText = favorites.length;
        }

        // Search & Filter Handlers
        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.getAttribute('data-cat') === cat) {
                    btn.className = "cat-btn active px-4 py-2 text-sm font-medium rounded-xl transition-all whitespace-nowrap bg-indigo-600 text-white shadow-md shadow-indigo-500/20";
                } else {
                    btn.className = "cat-btn px-4 py-2 text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 rounded-xl transition-all whitespace-nowrap";
                }
            });
            renderCards();
        }

        function handleSearch() {
            const input = document.getElementById('searchInput');
            searchQuery = input.value.trim().toLowerCase();
            document.getElementById('clearSearchBtn').classList.toggle('hidden', searchQuery === '');
            renderCards();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            searchQuery = '';
            document.getElementById('clearSearchBtn').classList.add('hidden');
            renderCards();
        }

        function resetFilters() {
            clearSearch();
            filterCategory('all');
        }

        // Copy Link Action
        function copyLink(url, e) {
            e.stopPropagation();
            navigator.clipboard.writeText(url).then(() => {
                showToast("Link copied to clipboard!");
            }).catch(err => {
                showToast("Failed to copy link");
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('translate-y-16', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-16', 'opacity-0');
            }, 2500);
        }

        // Render Cards Grid
        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            const emptyState = document.getElementById('emptyState');
            
            const filtered = resources.filter(item => {
                const matchesCat = currentCategory === 'all' 
                    || (currentCategory === 'favorites' && favorites.includes(item.id))
                    || item.category === currentCategory;
                
                const matchesSearch = searchQuery === '' 
                    || item.title.toLowerCase().includes(searchQuery)
                    || item.badge.toLowerCase().includes(searchQuery)
                    || item.description.toLowerCase().includes(searchQuery);

                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            grid.innerHTML = filtered.map(item => {
                const isFav = favorites.includes(item.id);
                return `
                <div class="group relative bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 hover:shadow-xl hover:border-indigo-300 dark:hover:border-indigo-500/50 transition-all duration-300 flex flex-col justify-between">
                    <div>
                        <!-- Header / Icon / Category -->
                        <div class="flex items-start justify-between gap-3 mb-4">
                            <div class="w-12 h-12 rounded-xl ${item.iconColor} flex items-center justify-center text-xl shrink-0 shadow-sm">
                                <i class="fa-solid ${item.icon}"></i>
                            </div>
                            <div class="flex items-center space-x-1.5">
                                <span class="text-[11px] font-semibold px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 uppercase tracking-wider">
                                    ${item.badge}
                                </span>
                                <button onclick="toggleFavorite('${item.id}', event)" class="p-1.5 rounded-lg text-slate-300 dark:text-slate-600 hover:text-amber-400 dark:hover:text-amber-400 transition" title="Bookmark tool">
                                    <i class="${isFav ? 'fa-solid text-amber-400' : 'fa-regular'} fa-star text-lg"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Title & Description -->
                        <h3 class="text-base font-bold text-slate-800 dark:text-slate-100 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors line-clamp-1 mb-1">
                            ${item.title}
                        </h3>
                        <p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2 leading-relaxed mb-6">
                            ${item.description}
                        </p>
                    </div>

                    <!-- Footer Actions -->
                    <div class="pt-4 border-t border-slate-100 dark:border-slate-800/80 flex items-center justify-between gap-2">
                        <button onclick="copyLink('${item.url}', event)" class="px-3 py-2 rounded-xl text-xs font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition flex items-center space-x-1.5">
                            <i class="fa-regular fa-copy"></i>
                            <span>Copy Link</span>
                        </button>

                        <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="px-4 py-2 rounded-xl text-xs font-semibold bg-indigo-600 text-white hover:bg-indigo-700 shadow-md shadow-indigo-500/10 hover:shadow-indigo-500/25 transition-all flex items-center space-x-1.5">
                            <span>Open</span>
                            <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                        </a>
                    </div>
                </div>
                `;
            }).join('');
        }

        // Initial Load
        updateStats();
        renderCards();
    </script>
</body>
</html>
